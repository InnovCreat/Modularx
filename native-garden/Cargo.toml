[package]
name    = "veritas-garden"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "veritas_garden"
path = "src/main.rs"

[dependencies]
eframe      = "0.27"
egui        = "0.27"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
rodio       = { version = "0.17", default-features = false }

[profile.release]
opt-level = 3
lto       = true
strip     = true
