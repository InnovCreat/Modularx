<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA Voice Synthesizer - Cyberpunk Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0e27;
      font-family: 'Orbitron', monospace;
      color: #00ffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        repeating-linear-gradient(0deg, rgba(0,255,255,0.03) 0px, transparent 1px, transparent 2px, rgba(0,255,255,0.03) 3px),
        radial-gradient(ellipse at center, rgba(138,43,226,0.1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      position: relative;
      z-index: 2;
      flex: 1;
    }

    .header {
      text-align: center;
      font-size: 2.5rem;
      font-weight: 900;
      margin-bottom: 30px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00ffff 0%, #ff00ff 50%, #00ffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 4px;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 5px rgba(0,255,255,0.5)); }
      to { filter: drop-shadow(0 0 20px rgba(255,0,255,0.8)); }
    }

    .top-controls {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .control-group {
      flex: 1;
      min-width: 200px;
    }

    .control-label {
      display: block;
      color: #00ffff;
      font-size: 0.9rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
    }

    select {
      width: 100%;
      padding: 12px;
      background: rgba(0,20,40,0.8);
      border: 2px solid #00ffff;
      color: #00ffff;
      font-family: 'Orbitron', monospace;
      font-size: 0.95rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 10px rgba(0,255,255,0.3);
    }

    select:hover {
      border-color: #ff00ff;
      box-shadow: 0 0 15px rgba(255,0,255,0.5);
    }

    select:focus {
      outline: none;
      border-color: #00ff00;
      box-shadow: 0 0 20px rgba(0,255,0,0.6);
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 15px;
      background: rgba(0,20,40,0.6);
      border: 2px solid #00ffff;
      color: #00ffff;
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      border-radius: 8px;
      resize: vertical;
      margin-bottom: 20px;
      box-shadow: inset 0 0 20px rgba(0,255,255,0.2);
      transition: all 0.3s;
    }

    textarea:focus {
      outline: none;
      border-color: #ff00ff;
      box-shadow: inset 0 0 30px rgba(255,0,255,0.3);
    }

    textarea::placeholder {
      color: rgba(0,255,255,0.4);
    }

    .slider-group {
      margin-bottom: 20px;
      background: rgba(0,20,40,0.5);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid rgba(0,255,255,0.3);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 12px;
    }

    .slider-row:last-child {
      margin-bottom: 0;
    }

    .slider-label {
      width: 100px;
      color: #00ffff;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="range"] {
      flex: 1;
      height: 6px;
      background: rgba(0,255,255,0.2);
      border: none;
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #00ffff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,255,255,0.8);
      transition: all 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: #ff00ff;
      box-shadow: 0 0 15px rgba(255,0,255,1);
      transform: scale(1.2);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: #00ffff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,255,255,0.8);
    }

    .slider-value {
      width: 60px;
      text-align: right;
      color: #ff00ff;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .visualizer {
      height: 300px;
      background: rgba(0,10,20,0.8);
      border: 2px solid #00ffff;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(0,255,255,0.4), inset 0 0 30px rgba(0,255,255,0.1);
    }

    #canvas {
      width: 100%;
      height: 100%;
    }

    .controls-bar {
      background: rgba(0,20,40,0.9);
      border: 2px solid #00ffff;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 0 0 20px rgba(0,255,255,0.3);
      position: sticky;
      bottom: 20px;
      z-index: 10;
    }

    .icon-btn {
      width: 60px;
      height: 60px;
      background: rgba(0,255,255,0.1);
      border: 2px solid #00ffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      font-size: 1.5rem;
      color: #00ffff;
    }

    .icon-btn:hover {
      background: rgba(255,0,255,0.2);
      border-color: #ff00ff;
      box-shadow: 0 0 20px rgba(255,0,255,0.6);
      transform: translateY(-3px);
    }

    .icon-btn:active {
      transform: translateY(0);
    }

    .icon-btn.playing {
      background: rgba(0,255,0,0.2);
      border-color: #00ff00;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .icon-btn.stop {
      border-color: #ff0066;
    }

    .icon-btn.stop:hover {
      background: rgba(255,0,102,0.2);
      box-shadow: 0 0 20px rgba(255,0,102,0.6);
    }

    .icon-btn.reset {
      border-color: #ffaa00;
    }

    .icon-btn.reset:hover {
      background: rgba(255,170,0,0.2);
      box-shadow: 0 0 20px rgba(255,170,0,0.6);
    }

    .icon-btn.record {
      border-color: #ff0000;
    }

    .icon-btn.record:hover {
      background: rgba(255,0,0,0.2);
      box-shadow: 0 0 20px rgba(255,0,0,0.6);
    }

    .icon-btn.record.recording {
      background: rgba(255,0,0,0.3);
      border-color: #ff0000;
      animation: pulse-red 1s ease-in-out infinite;
    }

    .icon-btn.save {
      border-color: #00ff88;
    }

    .icon-btn.save:hover {
      background: rgba(0,255,136,0.2);
      box-shadow: 0 0 20px rgba(0,255,136,0.6);
    }

    .btn-label {
      position: absolute;
      bottom: -25px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 10px rgba(0,255,0,0.5); }
      50% { box-shadow: 0 0 25px rgba(0,255,0,1); }
    }

    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 10px rgba(255,0,0,0.5); }
      50% { box-shadow: 0 0 25px rgba(255,0,0,1); }
    }

    @media (max-width: 768px) {
      .header { font-size: 1.8rem; }
      .top-controls { flex-direction: column; }
      .icon-btn { width: 50px; height: 50px; font-size: 1.2rem; }
      .visualizer { height: 200px; }
    }
  </style>
</head>

    };

    const emotionKeywords = {
      fr: {
        joie: ['heureux', 'joie', 'content', 'super', 'g\u00E9nial', 'magnifique', 'excellent'],
        tristesse: ['triste', 'malheureux', 'chagrin', 'd\u00E9sol\u00E9', 'd\u00E9prim\u00E9'],
        colere: ['col\u00E8re', 'furieux', '\u00E9nerv\u00E9', 'rage', 'irrit\u00E9'],

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function detectLanguage(text) {
      if (!text || text.length < 10) return 'fr';
      const lower = text.toLowerCase();
      const commonWords = {
        fr: ['le', 'la', 'de', 'un', 'et', 'est', 'que', 'dans'],
        en: ['the', 'is', 'and', 'of', 'to', 'in', 'that'],
        es: ['el', 'la', 'de', 'un', 'y', 'es', 'en'],
        de: ['der', 'die', 'das', 'und', 'ist', 'in'],
        it: ['il', 'la', 'di', 'un', 'e', '\u00E8', 'in']
      };
      let best = { lang: 'fr', score: 0 };
      Object.entries(commonWords).forEach(([lang, words]) => {
        let score = 0;
        words.forEach(w => {
          const regex = new RegExp('\\b' + w + '\\b', 'gi');
          const matches = lower.match(regex);
          if (matches) score += matches.length;
        });
        if (score > best.score) best = { lang, score };
      });
      return best.lang;
    }

    function detectEmotion(text, lang) {
      if (!text || text.length < 5) return 'neutre';
      const lower = text.toLowerCase();
      const keywords = emotionKeywords[lang] || emotionKeywords.fr;
      let best = { emotion: 'neutre', score: 0 };

      Object.entries(keywords).forEach(([emotion, words]) => {
        let score = 0;
        words.forEach(w => {
          if (lower.includes(w)) score += 2;
        });
        if (score > best.score) best = { emotion, score };
      });

      const excl = (text.match(/!/g) || []).length;
      if (excl > 2) best.emotion = 'excitation';
      else if (excl > 0 && best.emotion === 'neutre') best.emotion = 'joie';

      return best.emotion;
    }

    function cleanText(text) {
      return text
        .replace(/\*\*\*/g, '').replace(/\*\*/g, '').replace(/\*/g, '')
        .replace(/___/g, '').replace(/__/g, '').replace(/_/g, '')
        .replace(/^#{1,6}\s+/gm, '')
        .replace(/```[\s\S]*?```/g, '')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1')
        .replace(/<[^>]+>/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function scoreVoice(voice, targetLang, targetGender) {
      let score = 0;
      const nameLower = voice.name.toLowerCase();
      const lang = voice.lang.toLowerCase();

      if (lang.startsWith(targetLang + '-')) score += 15;
      else if (lang.startsWith(targetLang)) score += 10;

      if (targetLang === 'fr' && lang.includes('ca')) score += 5;

      const femaleKeywords = ['female', 'femme', 'woman', 'zira', 'aria', 'julie', 'pauline', 'amelie', 'celine'];
      const maleKeywords = ['male', 'homme', 'man', 'david', 'thomas', 'daniel', 'mark', 'paul'];

      const isFemale = femaleKeywords.some(k => nameLower.includes(k));
      const isMale = maleKeywords.some(k => nameLower.includes(k));

      if (targetGender === 'female' && isFemale) score += 8;
      else if (targetGender === 'male' && isMale) score += 8;
      else if (targetGender === 'all') score += 2;

      if (!voice.localService) score += 3;

      return score;
    }

    function loadVoices() {
      voices = synth.getVoices();
      const select = document.getElementById('voiceSelect');
      select.innerHTML = '';

      if (voices.length === 0) {
        select.innerHTML = '<option>' + translations[currentUILang].loading + '</option>';
        return;
      }

      const scored = voices.map((v, i) => ({
        voice: v,
        index: i,
        score: scoreVoice(v, detectedTextLang, currentGender)
      })).sort((a, b) => b.score - a.score);

      scored.forEach(({voice, index, score}) => {
        const opt = document.createElement('option');
        opt.value = index;
        const genderIcon = voice.name.toLowerCase().includes('female') || voice.name.toLowerCase().includes('femme') ? '\u2640' :
                          voice.name.toLowerCase().includes('male') || voice.name.toLowerCase().includes('homme') ? '\u2642' : '';
        opt.textContent = voice.name + ' (' + voice.lang + ') ' + genderIcon;
        select.appendChild(opt);
      });
    }

    loadVoices();
    if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 100);

    document.getElementById('langSelect').addEventListener('change', (e) => {
      currentUILang = e.target.value;
      updateUI();
    });

    document.getElementById('genderSelect').addEventListener('change', (e) => {
      currentGender = e.target.value;
      loadVoices();
    });

    function updateUI() {
      const t = translations[currentUILang];
      document.getElementById('texte').placeholder = t.placeholder;
      document.getElementById('voiceLabel').textContent = t.voice;
      document.getElementById('genderLabel').textContent = t.gender;
      document.getElementById('speedLabel').textContent = t.speed;
      document.getElementById('pitchLabel').textContent = t.pitch;
      document.getElementById('volumeLabel').textContent = t.volume;

      const genderSel = document.getElementById('genderSelect');
      genderSel.options[0].textContent = t.all;
      genderSel.options[1].textContent = t.female;
      genderSel.options[2].textContent = t.male;

      loadVoices();
    }

    function updateValues() {
      const rate = document.getElementById('rate').value;
      const pitch = document.getElementById('pitch').value;
      const volume = document.getElementById('volume').value;

      document.getElementById('rateValue').textContent = parseFloat(rate).toFixed(1) + 'x';
      document.getElementById('pitchValue').textContent = parseFloat(pitch).toFixed(1);
      document.getElementById('volumeValue').textContent = volume + '%';
    }

    ['rate', 'pitch', 'volume'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateValues);
    });

    document.getElementById('texte').addEventListener('input', () => {
      const text = document.getElementById('texte').value.trim();
      if (text.length > 10) {
        const cleaned = cleanText(text);
        detectedTextLang = detectLanguage(cleaned);
        detectedEmotion = detectEmotion(cleaned, detectedTextLang);
        loadVoices();
      }
    });

    function drawEmotionalWave() {
      const emotion = emotions[detectedEmotion];

      ctx.fillStyle = 'rgba(10,14,39,0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Cyberpunk grid
      ctx.strokeStyle = 'rgba(0,255,255,0.1)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 50) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i < canvas.height; i += 50) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Main emotional wave
      ctx.strokeStyle = emotion.color;
      ctx.lineWidth = 3;
      ctx.shadowBlur = 20;
      ctx.shadowColor = emotion.color;
      ctx.beginPath();

      for (let x = 0; x < canvas.width; x += 2) {
        const baseY = canvas.height / 2;
        const wave1 = Math.sin(x * 0.015 + waveOffset) * emotion.amplitude;
        const wave2 = Math.sin(x * 0.03 + waveOffset * 1.5) * (emotion.amplitude * 0.5);
        const wave3 = Math.sin(x * 0.007 + waveOffset * 0.8) * (emotion.amplitude * 0.3);
        const y = baseY + wave1 + wave2 + wave3;

        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Secondary wave
      ctx.strokeStyle = emotion.color + '80';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x < canvas.width; x += 3) {
        const y = canvas.height / 2 +
                 Math.sin(x * 0.02 + waveOffset * 1.2) * (emotion.amplitude * 0.6);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Emotional particles
      if (isPlaying) {
        ctx.fillStyle = emotion.color;
        for (let i = 0; i < 5; i++) {
          const x = (waveOffset * 50 + i * 150) % canvas.width;
          const y = canvas.height / 2 + Math.sin(waveOffset + i) * emotion.amplitude * 0.7;
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      waveOffset += isPlaying ? emotion.waveSpeed : 0.02;
      requestAnimationFrame(drawEmotionalWave);
    }
    drawEmotionalWave();

    document.getElementById('playBtn').addEventListener('click', () => {
      const text = document.getElementById('texte').value.trim();
      if (!text) return alert(translations[currentUILang].noText);

      synth.cancel();
      const cleaned = cleanText(text);

      detectedTextLang = detectLanguage(cleaned);
      detectedEmotion = detectEmotion(cleaned, detectedTextLang);

      utterance = new SpeechSynthesisUtterance(cleaned);
      utterance.rate = parseFloat(document.getElementById('rate').value);
      utterance.pitch = parseFloat(document.getElementById('pitch').value);
      utterance.volume = document.getElementById('volume').value / 100;

      const voiceIdx = document.getElementById('voiceSelect').value;
      if (voices[voiceIdx]) {
        utterance.voice = voices[voiceIdx];
      }

      utterance.onstart = () => {
        isPlaying = true;
        document.getElementById('playBtn').style.display = 'none';
        document.getElementById('pauseBtn').style.display = 'flex';
        document.getElementById('pauseBtn').classList.add('playing');
      };

      utterance.onend = () => {
        isPlaying = false;
        document.getElementById('playBtn').style.display = 'flex';
        document.getElementById('pauseBtn').style.display = 'none';
      };

      synth.speak(utterance);
    });

    document.getElementById('pauseBtn').addEventListener('click', () => {
      if (synth.speaking) {
        if (synth.paused) {
          synth.resume();
          document.getElementById('pauseBtn').classList.add('playing');
        } else {
          synth.pause();
          document.getElementById('pauseBtn').classList.remove('playing');
        }
      }
    });

    document.getElementById('stopBtn').addEventListener('click', () => {
      synth.cancel();
      isPlaying = false;
      document.getElementById('playBtn').style.display = 'flex';
      document.getElementById('pauseBtn').style.display = 'none';
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      synth.cancel();
      document.getElementById('texte').value = '';
      document.getElementById('rate').value = 1;
      document.getElementById('pitch').value = 1;
      document.getElementById('volume').value = 100;
      document.getElementById('genderSelect').value = 'all';
      currentGender = 'all';
      updateValues();
      isPlaying = false;
      detectedEmotion = 'neutre';
      detectedTextLang = 'fr';
      document.getElementById('playBtn').style.display = 'flex';
      document.getElementById('pauseBtn').style.display = 'none';
      loadVoices();
    });

    document.getElementById('recordBtn').addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
          };

          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const audioUrl = URL.createObjectURL(audioBlob);
            const a = document.createElement('a');
            a.href = audioUrl;
            a.download = 'luna-recording-' + Date.now() + '.wav';
            a.click();
          };

          mediaRecorder.start();
          isRecording = true;
          document.getElementById('recordBtn').classList.add('recording');
        } catch (err) {
          alert('Erreur microphone: ' + err.message);
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        document.getElementById('recordBtn').classList.remove('recording');
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      const text = document.getElementById('texte').value.trim();
      if (!text) return alert(translations[currentUILang].noText);

      const data = {
        text: text,
        rate: document.getElementById('rate').value,
        pitch: document.getElementById('pitch').value,
        volume: document.getElementById('volume').value,
        voice: document.getElementById('voiceSelect').value,
        emotion: detectedEmotion,
        lang: detectedTextLang,
        timestamp: new Date().toISOString()
      };

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'luna-config-' + Date.now() + '.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    updateValues();
  </script>
</body>
</html>
