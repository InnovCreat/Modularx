[package]
name    = "luna"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos        = { version = "0.6", features = ["csr"] }
wasm-bindgen  = "0.2"
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"

[dependencies.web-sys]
version  = "0.3"
features = [
  "AudioContext",
  "OscillatorNode",
  "OscillatorType",
  "GainNode",
  "StereoPannerNode",
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
  "Window",
  "Document",
  "console",
]

[profile.release]
opt-level = "z"
lto       = true
codegen-units = 1
