[package]
name = "modularx"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "MouseEvent",
    "DomRect",
    "console",
] }
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
