[package]
name = "vh-tracker-2026"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "Window",
    "AudioContext",
    "OscillatorNode",
    "GainNode",
    "AnalyserNode",
    "AudioDestinationNode",
] }

[profile.release]
opt-level = "z"
lto = true
