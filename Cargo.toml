[package]
name = "modularx"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "modularx"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.15", features = ["dynamic_linking"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
