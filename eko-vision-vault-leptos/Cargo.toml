[package]
name = "eko-vision-vault-leptos"
version = "0.1.0"
edition = "2021"

[lib]
name = "eko_vision_vault_leptos"
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
web-sys = { version = "0.3", features = [
  "Window",
  "Storage",
  "console",
  "History",
  "Location",
  "UrlSearchParams",
  "Navigator",
  "Clipboard",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
